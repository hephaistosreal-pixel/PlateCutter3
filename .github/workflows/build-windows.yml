name: Build Windows App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python scipy pillow pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconsole --onedir --collect-all scipy --hidden-import importlib.resources --name="PlateCutter" gui_app.py

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: PlateCutter-Windows
          path: dist/PlateCutter/
